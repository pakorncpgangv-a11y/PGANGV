<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICOCO Food Tech · ปลั๊กอินระบบค่าแรงเหมา v0.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Myanmar:wght@400;700&family=Noto+Sans+Khmer:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>/* ===== Emerald-Teal Premium · Tropical Fresh ===== */
:root{
  --e600:#059669; --t700:#0F766E; --s900:#0F172A; --e900:#064E3B; --mint:#A7F3D0; --mint2:#5EEAD4;
  --grad:linear-gradient(135deg,#059669 0%,#0D9488 55%,#0F766E 100%);
  --dark:linear-gradient(135deg,#0F172A 0%,#0B2A2C 50%,#064E3B 100%);
  --bg:#F3F8F6; --card:#FFFFFF; --line:#DCEAE4; --line2:#EEF6F2; --ink:#0F172A; --ink2:#5B6B7C; --link:#0F766E;
  --ok:#047857; --okbg:#E6F6EF; --warn:#B45309; --warnbg:#FEF3E2; --bad:#BE123C; --badbg:#FDEBEF; --grey:#475569; --greybg:#EEF2F5;
  --pri:#0F766E; --prifg:#FFFFFF; --focus:#14B8A6;
  --c1:#059669; --c2:#5EEAD4; --c3:#0F766E; --c4:#D97706;
  --r:14px; --sh:0 1px 2px rgba(6,78,59,.06),0 8px 24px -12px rgba(6,78,59,.18);
  --sans:"Inter","Noto Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --card:#111C24; --line:#1F3A36; --line2:#15262A; --ink:#E6F2EE; --ink2:#9DB4AE; --link:#5EEAD4;
  --ok:#34D399; --okbg:#0F2E25; --warn:#FBBF24; --warnbg:#33260F; --bad:#FB7185; --badbg:#3A1520; --grey:#B6C4C1; --greybg:#1B2A2E;
  --pri:#14B8A6; --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0B1220; --card:#111C24; --line:#1F3A36; --line2:#15262A; --ink:#E6F2EE; --ink2:#9DB4AE; --link:#5EEAD4;
  --ok:#34D399; --okbg:#0F2E25; --warn:#FBBF24; --warnbg:#33260F; --bad:#FB7185; --badbg:#3A1520; --grey:#B6C4C1; --greybg:#1B2A2E; --pri:#14B8A6; color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink);background:var(--bg);background-image:radial-gradient(1200px 400px at 100% -10%,rgba(94,234,212,.12),transparent 60%),radial-gradient(900px 380px at -10% 0%,rgba(5,150,105,.08),transparent 60%);background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:var(--dark);}}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .sp{flex:1}
.grid{display:grid;gap:16px} .grid>*{min-width:0} .f input,.f select{min-width:0} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* header + tabs: dark emerald */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--dark);color:#E6F2EE;box-shadow:0 10px 30px -18px rgba(6,78,59,.9);overflow:hidden}
.top::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 160px at 88% -30%,rgba(94,234,212,.28),transparent 70%),radial-gradient(360px 140px at 12% 130%,rgba(16,185,129,.22),transparent 70%);pointer-events:none}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:12px 24px 8px;max-width:1440px;margin:0 auto}
.brand{font-weight:800;font-size:17px;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:26px;height:26px;border-radius:8px 14px 8px 14px;background:var(--grad);box-shadow:0 0 0 1px rgba(167,243,208,.35),0 6px 16px -6px rgba(20,184,166,.8)}
.brand span{font-weight:500;color:#A7C9BF}
.demo{font-size:12px;background:rgba(167,243,208,.14);color:#A7F3D0;border:1px solid rgba(167,243,208,.3);border-radius:999px;padding:2px 10px;font-weight:600;white-space:nowrap}
.who{display:flex;gap:6px;align-items:center;font-size:13px;color:#A7C9BF}
.who select,.clock select{border:1px solid rgba(167,243,208,.28)!important;border-radius:10px!important;padding:6px 10px!important;background:rgba(15,23,42,.55)!important;color:#E6F2EE;max-width:240px}
.clock{font-size:12.5px;color:#A7C9BF;white-space:nowrap}
.top .btn{background:rgba(255,255,255,.06);border-color:rgba(167,243,208,.28);color:#E6F2EE}
.tabs{position:relative;display:flex;gap:4px;padding:4px 24px 0;max-width:1440px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 16px 12px;text-decoration:none;color:#A7C9BF;white-space:nowrap;font-weight:500;border-radius:10px 10px 0 0;position:relative}
.tabs a:hover{color:#fff}
.tabs a.on{color:#fff;font-weight:700}
.tabs a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#34D399,#5EEAD4)}
.tabs a .n{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:#FB7185;color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1440px;margin:0 auto;padding:24px 24px 90px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.sub a{padding:7px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink2);font-size:14px;background:var(--card);font-weight:500}
.sub a:hover{border-color:var(--mint2);color:var(--ink)}
.sub a.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px -8px rgba(5,150,105,.8)}
h1{font-size:24px;margin:0 0 4px;line-height:1.25;letter-spacing:-.015em;font-weight:800} h2{font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:-.005em} h3{font-size:15px;margin:0 0 8px;font-weight:700}
.lead{color:var(--ink2);margin:0 0 16px;max-width:860px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:16px} .grid>.card+.card{margin-top:0}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(94,234,212,.22),transparent 70%)}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi .v{background:linear-gradient(135deg,#6EE7B7,#5EEAD4);-webkit-background-clip:text;background-clip:text}}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:500}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:4px}
hr{border:0;border-top:1px solid var(--line2);margin:12px 0}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.grey{color:var(--grey)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap;background:var(--card)}
.tag.legal{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn);background:var(--warnbg)} .tag.okl{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);background:var(--okbg)} .tag.ph{border-style:dashed}
.ph{color:var(--ink2);font-family:var(--mono);border:1px dashed color-mix(in srgb,var(--t700) 40%,var(--line));border-radius:6px;padding:0 6px;background:var(--line2)}

/* buttons + forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);transition:box-shadow .15s,transform .15s,border-color .15s}
.btn:hover{border-color:var(--mint2);box-shadow:0 6px 18px -10px rgba(15,118,110,.6)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px rgba(5,150,105,.9),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 12px 26px -12px rgba(5,150,105,1)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.f label,.f .lb{font-size:13.5px;font-weight:600}
.f .req::after{content:" *";color:var(--bad)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--card);min-height:44px;width:100%;font-size:16px;transition:border-color .15s,box-shadow .15s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#14B8A6;box-shadow:0 0 0 4px rgba(20,184,166,.15);outline:none}
.f textarea{min-height:72px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--ink2)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--bad)}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.ck input{width:20px;height:20px;margin-top:2px;accent-color:#0F766E}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;min-height:34px;border-radius:9px;font-weight:500}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px -6px rgba(5,150,105,.9)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{text-align:left;font-weight:700;font-size:12.5px;color:var(--t700);padding:10px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#F4FBF8,#EDF7F3);white-space:nowrap;position:sticky;top:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t th{background:#13232A;color:#5EEAD4}}
.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:color-mix(in srgb,#5EEAD4 10%,transparent)}
.t tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--line2)}
.t td.x{background:var(--badbg)} .t td.w{background:var(--warnbg)}
.t input,.t select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card);min-height:40px;font-size:15px;width:100%}

/* checks list */
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;padding:9px 12px;border-radius:12px;font-size:14px;align-items:flex-start}
.chk.bad{background:var(--badbg);color:var(--bad)} .chk.warn{background:var(--warnbg);color:var(--warn)} .chk.ok{background:var(--okbg);color:var(--ok)}
.chk b{white-space:nowrap}
.note{border-left:3px solid var(--mint2);padding:8px 14px;color:var(--ink2);font-size:14px;margin:8px 0;background:color-mix(in srgb,#5EEAD4 8%,transparent);border-radius:0 10px 10px 0}
.note.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)} .note.bad{border-color:var(--bad);color:var(--bad);background:var(--badbg)} .note.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}

/* signature: pay-period strip as dark emerald hero */
.hero{background:var(--dark)!important;color:#E6F2EE;border-color:transparent!important;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 200px at 95% 0%,rgba(94,234,212,.25),transparent 70%),radial-gradient(400px 180px at 0% 120%,rgba(16,185,129,.25),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero h2{color:#fff}
.hero .muted,.hero .small{color:#A7C9BF}
.hero .st.grey{color:#CBE7DF} .hero .st.ok{color:#6EE7B7} .hero .st.warn{color:#FCD34D}
.strip{position:relative;padding:22px 6px 6px}
.strip .track{position:absolute;left:6px;right:6px;top:34px;height:6px;background:rgba(167,243,208,.16);border-radius:4px}
.strip .fill{position:absolute;left:6px;top:34px;height:6px;background:linear-gradient(90deg,#10B981,#2DD4BF);border-radius:4px;box-shadow:0 0 14px rgba(45,212,191,.7)}
.strip .now{position:absolute;top:16px;width:2px;height:42px;background:#FDE68A;box-shadow:0 0 10px rgba(253,230,138,.8)}
.strip .now span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11.5px;color:#FDE68A;font-weight:700;white-space:nowrap}
.strip .ms{display:flex;justify-content:space-between;position:relative}
.strip .m{display:flex;flex-direction:column;align-items:center;gap:6px;width:25%;text-align:center}
.strip .m i{width:16px;height:16px;border-radius:50%;background:#0F172A;border:3px solid rgba(167,243,208,.35);margin-top:5px}
.strip .m.done i{border-color:#34D399;background:#34D399;box-shadow:0 0 0 4px rgba(52,211,153,.2)} .strip .m.cur i{border-color:#FDE68A}
.strip .m b{font-size:13.5px;color:#fff} .strip .m span{font-size:12.5px;color:#A7C9BF}

/* mobile worksheet */
.wsrow{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);margin-bottom:10px;box-shadow:var(--sh)}
.wsrow.bad{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 12%,transparent)}
.jobinfo{background:linear-gradient(135deg,rgba(5,150,105,.08),rgba(15,118,110,.08));border:1px solid color-mix(in srgb,#14B8A6 30%,transparent);border-radius:12px;padding:12px 14px;font-size:14px}

/* modal + toast */
.mbg{position:fixed;inset:0;background:rgba(6,20,24,.55);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:18px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:0 30px 80px -30px rgba(6,78,59,.6);border-top:4px solid transparent;border-image:var(--grad) 1;border-image-slice:1 0 0 0}
.modal.wide{width:min(1100px,100%)}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--dark);color:#E6F2EE;padding:11px 20px;border-radius:999px;z-index:90;font-size:14px;max-width:92vw;text-align:center;box-shadow:0 14px 30px -12px rgba(6,78,59,.8);border:1px solid rgba(167,243,208,.25)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);fill:var(--ink2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* A4 document: print-safe black & white, thin emerald accent rule on screen */
.paper{background:#fff;color:#000;width:210mm;max-width:100%;min-height:297mm;padding:14mm 12mm;margin:0 auto;box-shadow:var(--sh);border-radius:6px;font-size:12px;line-height:1.6;border-top:4px solid #059669}
.paperwrap{overflow-x:auto;padding-bottom:8px}
.paperwrap .paper{max-width:none}
.paper.my,.paper.km{line-height:1.75}
.paper h1{font-size:18px;color:#000;margin:0;background:none;-webkit-text-fill-color:#000}
.paper .hd{display:flex;justify-content:space-between;gap:12px;border-bottom:1.5px solid #000;padding-bottom:6px;margin-bottom:10px}
.paper table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0 12px}
.paper th,.paper td{border:1px solid #000;padding:4px 6px;vertical-align:top;color:#000}
.paper th{background:#fff;font-weight:700;text-align:left}
.paper .box{display:inline-block;width:14px;height:14px;border:1px solid #000;vertical-align:middle}
.paper .cat{font-size:14px;font-weight:700;margin:12px 0 2px}
.paper .foot{border-top:1px solid #000;margin-top:10px;padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.paper .tr2{display:block;font-size:10.5px;font-weight:400}
.fmy{font-family:"Noto Sans Myanmar","Noto Sans Thai",sans-serif} .fkm{font-family:"Noto Sans Khmer","Noto Sans Thai",sans-serif} .fzh{font-family:"Noto Sans SC","Noto Sans Thai",sans-serif}
.pbreak{page-break-before:always;break-before:page}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .top,.noprint,.sub,.toast,.mbg{display:none!important}
  main{padding:0;max-width:none}
  .paperwrap{overflow:visible}
  .paper{box-shadow:none;margin:0;width:auto;min-height:auto;border-top:0;border-radius:0}
}
@media (max-width:900px){
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{padding:10px 14px 6px;flex-wrap:wrap}
  .tabs{padding:2px 8px 0}
  main{padding:16px 12px 80px}
}
@media (max-width:600px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr!important}
  .clock{display:none}
  h1{font-size:20px}
  .strip .m span{display:none}
  .who select{max-width:58vw}
}

/* แถบยอดรวมติดขอบล่างของใบงาน (มือถือใช้มือเดียวได้) */
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--dark);color:#E6F2EE;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -14px rgba(6,78,59,.8)}
.stickybar .sb-in{max-width:880px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.stickybar b{color:#6EE7B7;font-variant-numeric:tabular-nums}
.stickybar .btn{min-height:44px} .stickybar .btn:not(.pri){background:rgba(255,255,255,.08);border-color:rgba(167,243,208,.3);color:#E6F2EE}
@media print{.stickybar{display:none}}
@media (max-width:600px){
  .wsrow .g4,.wsrow .g2{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .wsrow .f input{min-height:44px;padding:8px}
  .wsrow{padding:12px}
}
.sortbtn{all:unset;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}
.sortbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.mangrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.mantoc{position:sticky;top:120px;padding:8px;display:flex;flex-direction:column;gap:2px}
.mantoc a{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}
.mantoc a.on{background:var(--grad);color:#fff} .mantoc a.on .muted{color:#D1FAE5}
.mantoc a:hover:not(.on){background:var(--line2)}
.manbody{line-height:1.75;max-width:900px} .manbody ol,.manbody ul{padding-left:20px} .manbody li{margin:6px 0} .manbody table{margin:10px 0}

<script>/* ===== ICOCO Food Tech · ปลั๊กอินระบบค่าแรงเหมา (ต้นแบบ · ข้อมูลสมมติ) =====
   แยกจากระบบหลัก ไม่แก้ระบบเดิม · เชื่อมผ่านไฟล์เชื่อมระบบหลัก (JSON) และไฟล์รูปแบบ 05/04 */
const KEY = 'icoco-ft:v1';
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'], TH_D = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const D = s => new Date(s + 'T00:00:00');
const iso = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return iso(d); };
const fd = s => { const d = D(s); return `${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear()}`; };
const fds = s => { const d = D(s); return `${d.getDate()} ${TH_M[d.getMonth()]}`; };
const fdw = s => `${TH_D[D(s).getDay()]} ${fds(s)}`;
const fdt = t => { const d = new Date(t); return `${d.getDate()} ${TH_M[d.getMonth()]} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const r2 = x => Math.round((+x + Number.EPSILON) * 100) / 100;
const fmt = (x, d = 2) => (+x || 0).toLocaleString('th-TH', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmt0 = x => (+x || 0).toLocaleString('th-TH', {maximumFractionDigits:0});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const toM = t => { if (!t) return null; const [h, m, s] = String(t).split(':').map(Number); return h * 60 + (m || 0) + (s || 0) / 60; };
const hm = m => m == null ? '–' : `${String(Math.floor(((m % 1440) + 1440) % 1440 / 60)).padStart(2, '0')}:${String(Math.round(((m % 60) + 60) % 60) % 60).padStart(2, '0')}`;
const nowTs = () => new Date(S.now).getTime();
const today = () => S.now.slice(0, 10);

/* ---------- ส่วนงานมาตรฐาน (ชื่อในรายชื่อสะกดต่างกัน จับคู่ให้) ---------- */
const SECS = [
  {id:'CUT', en:'CUT UP', th:'ผ่า', job:'FT-CUT', alias:['cut up','cutup','cut','ผ่า']},
  {id:'TRIM', en:'TRIM', th:'คว้าน', job:'FT-TRIM', alias:['trim','คว้าน']},
  {id:'TILL', en:'TILL', th:'ทิวส์', job:'FT-TILL', alias:['till','ทิวส์','ทิว']},
  {id:'PACK', en:'Pack', th:'แพ็ค', alias:['pack','แพ็ค','แพค']},
  {id:'REPACK', en:'RePack', th:'รีแพ็ค', alias:['repack','re pack','re-pack','รีแพ็ค']},
  {id:'WATER', en:'Water', th:'น้ำมะพร้าว', alias:['water','น้ำ','น้ำมะพร้าว']},
  {id:'BELLY', en:'ท้อง', th:'ท้อง', alias:['ท้อง','belly']},
  {id:'RM', en:'RM', th:'วัตถุดิบ', alias:['rm','r m','วัตถุดิบ']},
];
const SEC = Object.fromEntries(SECS.map(s => [s.id, s]));
const secName = id => SEC[id] ? `${SEC[id].en} (${SEC[id].th})` : (id || '–');
function normSec(raw) { const k = String(raw || '').trim().toLowerCase().replace(/\s+/g, ' '); const hit = SECS.find(s => s.alias.includes(k) || s.en.toLowerCase() === k); return hit ? hit.id : null; }

/* ---------- เรทและเงินจูงใจ ตามประกาศ 013–017/2568 (ยังไม่ขึ้นทะเบียนผ่านใบขอเรทของระบบหลัก) ---------- */
const JOBS = {
  'FT-CUT':  {name:'ผ่ามะพร้าว (สโนว์บอล)', sec:'CUT', vers:[
               {notice:'013/2568', eff:'2025-10-09', to:'2026-11-04', tiers:[{min:1000, max:null, rate:0.60}, {min:1, max:999, rate:0.55}]},
               {notice:'17/2569', eff:'2026-11-05', to:null, tiers:[{min:1000, max:null, rate:0.60}, {min:1, max:999, rate:0.55}]}],
              inc:{notice:'014/2568', eff:'2025-10-09', to:'2026-11-04', tiers:[{min:1000, amt:90}, {min:900, amt:80}, {min:800, amt:70}, {min:700, amt:60}, {min:600, amt:50}]},
              dept:{notice:'014/2568', eff:'2025-10-09', to:'2026-11-04', tiers:[{min:35000, amt:90}, {min:30000, amt:80}, {min:25000, amt:70}, {min:20000, amt:60}, {min:18000, amt:50}]}},
  'FT-TRIM': {name:'คว้านมะพร้าว (สโนว์บอล)', sec:'TRIM', gapNote:'1–299 ลูก ไม่มีในประกาศ 016/2568 (ตั้งแต่ 5 พ.ย. 2569 จ่ายลูกละ 1 บาท)', vers:[
               {notice:'016/2568', eff:'2025-10-25', to:'2026-11-04', tiers:[{min:900, max:null, rate:1.30}, {min:700, max:899, rate:1.20}, {min:500, max:699, rate:1.10}, {min:300, max:499, rate:1.00}]},
               {notice:'17/2569', eff:'2026-11-05', to:null, gradeB:0.50, tiers:[{min:900, max:null, rate:1.30}, {min:700, max:899, rate:1.20}, {min:500, max:699, rate:1.10}, {min:300, max:499, rate:1.00}, {min:1, max:299, rate:1.00, note:'ผู้บริหารกำหนด 1–299 ลูก ลูกละ 1 บาท'}]}],
              inc:{notice:'015/2568', eff:'2025-10-09', to:'2026-11-04', tiers:[{min:700, amt:90}, {min:600, amt:80}, {min:500, amt:70}, {min:400, amt:60}]},
              dept:{notice:'015/2568', eff:'2025-10-09', to:'2026-11-04', tiers:[{min:16000, amt:90}, {min:13000, amt:80}, {min:10000, amt:70}, {min:8000, amt:60}]}},
  'FT-TILL': {name:'ทิวส์มะพร้าว (สโนว์บอล)', sec:'TILL', vers:[
               {notice:'017/2568', eff:'2025-10-30', to:'2026-11-04', tiers:[{min:451, max:null, rate:1.30}, {min:1, max:450, rate:1.20}]},
               {notice:'17/2569', eff:'2026-11-05', to:null, gradeB:0.50, tiers:[{min:451, max:null, rate:1.30}, {min:1, max:450, rate:1.20}]}]},
  'FT-WCUT': {name:'ผ่าน้ำมะพร้าว (รายวัน)', dayJob:true, vers:[{notice:'ผู้บริหารกำหนด', eff:'2025-01-01', to:null, dayRate:347}]},
  'FT-PACK': {name:'แพ็คสโนว์บอล (ห้อง PACK)', sec:'PACK', pack:true, vers:[
               {notice:'18/2569', eff:'2026-11-11', to:null, products:{p300:{label:'300G', tiers:[{min:10001, max:null, rate:0.85}, {min:1, max:10000, rate:0.75}]}, p454:{label:'454G, 520G', tiers:[{min:5001, max:null, rate:1.00}, {min:1, max:5000, rate:0.95}]}}}]},
};
const NOTICES_CANCELLED = [['013/2568','ผ่ามะพร้าว'],['014/2568','เงินจูงใจงานผ่า (รายคนและรวมแผนก)'],['015/2568','เงินจูงใจงานคว้าน (รายคนและรวมแผนก)'],['016/2568','คว้านมะพร้าว'],['017/2568','ทิวส์มะพร้าว']];
const onDate = (x, d) => x && d >= x.eff && (!x.to || d <= x.to) ? x : null;
const incOn = (jid, d) => onDate((JOBS[jid] || {}).inc, d), deptOn = (jid, d) => onDate((JOBS[jid] || {}).dept, d);
const jv = (jid, d) => { const j = JOBS[jid]; return j ? j.vers.find(v => d >= v.eff && (!v.to || d <= v.to)) || null : null; };
const jobsOn = d => Object.keys(JOBS).filter(k => jv(k, d));
/* ค่าตั้งค่า (ข้อเสนอใน Brief · รอยืนยัน · HR แก้ได้ มีประวัติ) */
const SET0 = {newDayRate:347, packBasis:'room', gradeBInTier:'no', dedupSec:120, cmpMin:15, defectPct:10, nearPct:2, tierBasis:'whole', qtyBasis:'good', deptBasis:'good', dayStartHour:5, otMult:1.5, normalH:8, otMaxH:6, netMaxH:14};
const SET_LBL = {newDayRate:['อัตรารายวันพนักงาน Food Tech (คนใหม่ตั้งต้น)','บาท/วัน'], packBasis:['ห้อง PACK เทียบขั้นด้วย','room = ยอดรวมห้องต่อวัน แบ่งเงินตามชั่วโมง · person = ยอดรายคน'], gradeBInTier:['นับเกรด B รวมในยอดเทียบขั้น','no = ไม่นับ · yes = นับ'], dedupSec:['ตัดสแกนซ้ำภายใน','วินาที'], cmpMin:['เวลาจดกับสแกนต่างเกิน','นาที = ต้องใส่เหตุผล'], defectPct:['เงินจูงใจ: ของเสียต้องน้อยกว่า','%'], nearPct:['รายงานยอดใกล้เกณฑ์','± %'],
  tierBasis:['เรทขั้นบันไดคิด','whole = ทั้งวัน · marginal = เฉพาะส่วนที่เกิน'], qtyBasis:['ยอดที่ใช้เทียบขั้น (รายคน)','good = ลูกดี · all = ลูกทั้งหมด'], deptBasis:['ยอดรวมแผนกนับ','good = ลูกดี · all = ลูกทั้งหมด'],
  dayStartHour:['สแกนก่อนเวลานี้นับเป็นวันก่อนหน้า (กะข้ามเที่ยงคืน)','นาฬิกา'], otMult:['OT รายวัน','เท่า'], normalH:['ชั่วโมงปกติ','ชม./วัน'], otMaxH:['OT ไม่เกิน','ชม./วัน'], netMaxH:['ชั่วโมงรวมไม่เกิน','ชม./วัน']};
const OPEN_Q = [
  ['กลุ่มจ่าย B-Plus ของรหัส 7 หลัก','รอตัวเลขจากบัญชี · ยังไม่ระบุ = ไม่ออกในไฟล์ 04'],
  ['ระยะเก็บข้อมูลสแกน','รอ DPO'],
];


const ROLES = [
  {key:'hr', label:'HR ธุรการ'}, {key:'hrm', label:'ผู้จัดการ HR'},
  {key:'ftlead', label:'หัวหน้า Food Tech'}, {key:'ftmgr', label:'ผู้จัดการ Food Tech'},
  {key:'ceo', label:'CEO'}, {key:'dceo', label:'DCEO'}, {key:'acc', label:'ทีมบัญชี'},
];
const role = () => ROLES.find(r => r.key === S.role);
const isHR = () => ['hr','hrm'].includes(S.role), isExec = () => ['ceo','dceo'].includes(S.role);

/* ---------- งวด (ปฏิทินเดียวกับระบบหลัก) ---------- */
function periodOf(d) { const x = D(d), y = x.getFullYear(), m = x.getMonth(), day = x.getDate(); let from, to;
  if (day >= 11 && day <= 25) { from = iso(new Date(y, m, 11)); to = iso(new Date(y, m, 25)); }
  else if (day >= 26) { from = iso(new Date(y, m, 26)); to = iso(new Date(y, m + 1, 10)); }
  else { from = iso(new Date(y, m - 1, 26)); to = iso(new Date(y, m, 10)); }
  return {id:'P' + from.replace(/-/g, '').slice(2), from, to}; }
const curPeriod = () => periodOf(today());
function periodsRecent(n = 4) { const L = []; let p = curPeriod(); for (let i = 0; i < n; i++) { L.push(p); p = periodOf(addDays(p.from, -1)); } return L; }

/* ---------- ขั้นเรท / เงินจูงใจ ---------- */
const tierOf = (tiers, q) => { const t = (tiers || []).find(x => q >= x.min && (x.max == null || q <= x.max)); return t ? t.rate : null; };
function tierRate(jid, q, d = today()) { const v = jv(jid, d); return v && v.tiers ? tierOf(v.tiers, q) : null; }
function piecePay(jid, good, all, d = today(), gb = 0) {
  const v = jv(jid, d), q = (S.set.qtyBasis === 'all' ? all : good) + (S.set.gradeBInTier === 'yes' ? gb : 0); if (!v) return {rate:null, amt:0, ok:false, why:'noversion'};
  let amt = 0, rate = null, ok = true;
  if (good) { if (S.set.tierBasis === 'marginal') { const asc = v.tiers.slice().sort((a, b) => a.min - b.min); for (let u = 1; u <= good; ) { const t = asc.find(x => u >= x.min && (x.max == null || u <= x.max)); if (!t) { ok = false; break; } const end = t.max == null ? good : Math.min(good, t.max); amt += (end - u + 1) * t.rate; u = end + 1; } rate = ok ? r2(amt / good) : null; }
    else { rate = tierOf(v.tiers, q); if (rate == null) ok = false; else amt = good * rate; } }
  let bAmt = 0; if (gb) { if (v.gradeB == null) return {rate, amt:0, ok:false, why:'nogradeB'}; bAmt = gb * v.gradeB; }
  return {rate, amt:ok ? r2(amt + bAmt) : 0, gAmt:ok ? r2(amt) : 0, bAmt:r2(bAmt), ok, v};
}
const tierAmt = (tiers, q) => { const t = (tiers || []).slice().sort((a, b) => b.min - a.min).find(x => q >= x.min); return t ? t.amt : 0; };
const defectPct = (g, b, gb = 0) => (g + b + gb) ? b / (g + b + gb) * 100 : 0;

/* ---------- ไฟล์สแกน .DAT ---------- */
function parseDat(text) { const rows = [], bad = []; text.split(/\r?\n/).forEach((ln, i) => { if (!ln.trim()) return; const c = ln.split('\t'); if (c.length < 6) { bad.push(i + 1); return; } const uid = c[0].trim(), ts = c[1].trim(); if (!/^\d+$/.test(uid) || !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}(:\d{2})?$/.test(ts)) { bad.push(i + 1); return; } rows.push({uid, ts}); }); return {rows, bad}; }
async function sha256(text) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { let h = 0; for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0; return 'h' + (h >>> 0).toString(16); } }
const serialOf = name => (String(name).match(/[A-Z0-9]{8,}/i) || [String(name).replace(/\.dat$/i, '')])[0];
/* รหัสเครื่องที่ตรงกับคน Food Tech: ตรงช่องรหัสสแกน หรือเสนอจับคู่ (เท่ารหัสพนักงาน / ตัดเลข 0 หนึ่งตัวแล้วตรง) */
function matchUid(uid) {
  const byScan = S.emps.find(e => e.scanId === uid); if (byScan) return {emp:byScan.code, how:'scan'};
  const free = S.emps.filter(e => !e.scanId);
  const eq = free.find(e => e.code === uid); if (eq) return {emp:eq.code, how:'equal'};
  for (let i = 0; i < uid.length; i++) if (uid[i] === '0') { const c = uid.slice(0, i) + uid.slice(i + 1), m = free.find(e => e.code === c); if (m) return {emp:m.code, how:'zero'}; }
  return null;
}
function dayOfScan(ts) { const d = ts.slice(0, 10), h = +ts.slice(11, 13); return h < S.set.dayStartHour ? addDays(d, -1) : d; }
/* สรุปต่อคนต่อวัน: ตัดซ้ำ ใช้ลำดับ (เครื่องไม่บอกเข้า/ออก) */
function scanDay(code, d) {
  const L = (S.scans[code + '|' + d] || []).slice().sort(); const out = []; L.forEach(ts => { const t = new Date(ts.replace(' ', 'T')).getTime(); if (!out.length || (t - out[out.length - 1].t) / 1000 > S.set.dedupSec) out.push({ts, t}); });
  const n = out.length, mm = x => { const m = toM(x.ts.slice(11)); return x.ts.slice(0, 10) > d ? m + 1440 : m; };
  const r = {n, raw:L.length, in:n ? mm(out[0]) : null, out:n > 1 ? mm(out[n - 1]) : null, bout:null, bin:null, ok:n === 2 || n === 4};
  if (n === 4) { r.bout = mm(out[1]); r.bin = mm(out[2]); }
  r.span = n > 1 ? (out[n - 1].t - out[0].t) / 3600e3 : 0; return r;
}
const covered = d => (S.imports || []).some(im => d >= im.from && d <= im.to);

/* ---------- ใบงาน ---------- */
const netH = r => { if (!r.in || !r.out) return 0; let a = toM(r.in), b = toM(r.out); if (b <= a) b += 1440; return Math.max(0, (b - a - (+r.brk || 0)) / 60); };
const emp = c => S.emps.find(e => e.code === c);
const empName = c => { const e = emp(c); return e ? `${e.title || ''} ${e.name}`.trim() : c; };
const pres = s => s.rows.filter(r => r.present);
function deptTotals(s) { const o = {}; pres(s).filter(r => r.mode === 'piece' && !(JOBS[r.job] || {}).pack && !(JOBS[r.job] || {}).dayJob).forEach(r => { const g = +r.good || 0, b = +r.bad || 0; const x = o[r.job] = o[r.job] || {good:0, bad:0}; x.good += g; x.bad += b; }); return o; }
/* คำนวณทั้งใบ: ค่าแรงรายคน + เงินจูงใจรายคน + เงินจูงใจรวมแผนก */
function calcSheet(s) {
